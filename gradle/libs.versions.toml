# Version catalog — the single place for build/test versions (plan T3).
# The library itself has NO runtime dependencies; everything here is test- or build-only.
# (The foojay settings plugin cannot read this catalog; its version lives in settings.gradle.)

[versions]
junit-jupiter = "5.14.4"            # 5.x line: JUnit 6 requires Java 17, the build targets Java 11
junit-platform = "1.14.4"
animalsniffer-plugin = "2.0.1"
android-api24-signature = "7.0_r2"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
android-api24-signature = { module = "net.sf.androidscents.signature:android-api-level-24", version.ref = "android-api24-signature" }

[plugins]
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer-plugin" }
