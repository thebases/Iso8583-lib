plugins {
    id 'application'
}

group = 'com.base'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":app")
    // JUnit 5 for testing
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

application {
    // This should match your actual Java class
    mainClass = 'com.base.app.App'
}

tasks.named('test') {
    useJUnitPlatform()
}
