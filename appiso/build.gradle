plugins {
    id 'application'
}

group = 'com.base'
version = '1.0.0'

repositories {
    mavenCentral()
}

// Consume the library exactly as an integrator would: the built jar file, not the :app project.
// builtBy makes ':appiso:*' tasks run ':app:jar' first, so the file always exists and is current.
def isoVersion = '2.0.0'
def isoJar = rootProject.file("app/build/libs/iso8583-${isoVersion}.jar")

dependencies {
    implementation files(isoJar) { builtBy ':app:jar' }
    // JUnit 5 for testing
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

application {
    // This should match your actual Java class
    mainClass = 'com.base.app.App'
}

tasks.named('test') {
    useJUnitPlatform()
}
